# Default configuration. paper mode is the safe default — see the "live"
# section below for what's required to ever place a real-money order.
mode: paper                      # paper | live (CLI --mode flag overrides this)

markets:
  crypto:
    enabled: true
    provider: ccxt_binance
    symbol: BTC/USDT
    timeframe: 1h
    sandbox: true                 # use Binance testnet endpoints
  stocks:
    enabled: true
    provider: alpaca
    symbol: AAPL
    timeframe: 1Hour
    paper: true                   # use Alpaca's paper-trading base URL

strategy:
  name: ma_crossover
  params:
    fast_period: 10
    slow_period: 50

risk:
  risk_pct_per_trade: 0.01        # fraction of equity risked per trade
  min_risk_reward_ratio: 1.5
  max_open_positions: 5
  max_exposure_pct_per_symbol: 0.25
  max_daily_drawdown_pct: 0.05
  default_stop_loss_pct: 0.02     # fallback stop distance if a strategy doesn't set one

fees:
  taker_fee_pct: 0.001            # used by backtest engine and SimulatedAdapter

execution:
  poll_interval_seconds: 60
  max_retries: 3
  log_format: sqlite              # sqlite | csv

live:
  # Both this flag AND the CLI `--live-confirm` flag must be set before
  # `mode: live` is allowed to reach a real broker/exchange adapter.
  confirm_live_trading: false
