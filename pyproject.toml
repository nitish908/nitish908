[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent"
version = "0.1.0"
description = "Automated trading agent for crypto and stocks with technical-indicator strategies, risk management, and accurate profit-margin accounting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "ccxt>=4.0",
    "alpaca-py>=0.20",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "tenacity>=8.2",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "freezegun>=1.4",
    "ta>=0.11",
]

[project.scripts]
trading-agent = "trading_agent.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
